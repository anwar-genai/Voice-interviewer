# Dependency scanning: weekly PRs for vulnerable/stale deps across all three
# ecosystems. CI (tests + evals gate) decides whether an update is safe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
